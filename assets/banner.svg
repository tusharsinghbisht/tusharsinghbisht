<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tushar Singh Bisht, AI, security and developer tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="10" fill="url(#grid)"/>
  <rect x="520" width="680" height="300" rx="10" fill="url(#fade)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="118" font-size="20" fill="#7ee787">$ whoami</text>
    <text x="70" y="178" font-size="54" font-weight="700" fill="#f0f6fc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Tushar Singh Bisht</text>
    <text x="70" y="222" font-size="20" fill="#8b949e">AI  /  security  /  developer tooling</text>
    <rect x="70" y="240" width="12" height="22" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
