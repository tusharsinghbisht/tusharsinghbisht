<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">0xBENZO — security, AI, and systems</title>
  <desc id="desc">A neon green terminal banner with an animated signal diagram. Tushar Singh Bisht, software engineer, Delhi Technological University.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#172923" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#080e0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#080e0c"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#b9ff66" stop-opacity=".1"/>
      <stop offset="1" stop-color="#b9ff66" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bounds"><rect x="1" y="1" width="1278" height="518" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .orbit { transform-origin: 1000px 255px; animation: orbit 32s linear infinite; }
      .cursor { animation: cursor 1.4s step-end infinite; }
      .packet { stroke-dasharray: 7 33; animation: packet 7s linear infinite; }
      .pulse { animation: pulse 3.8s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes cursor { 50% { opacity: 0; } }
      @keyframes packet { to { stroke-dashoffset: -160; } }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .orbit, .cursor, .packet, .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="520" fill="#080e0c"/>
    <rect x="710" y="44" width="570" height="419" fill="url(#grid)" opacity=".7"/>
    <circle cx="1000" cy="255" r="245" fill="url(#halo)"/>
    <rect x="0" y="0" width="1280" height="51" fill="#0f1914"/>
    <path d="M0 51H1280M0 454H1280" stroke="#24352c"/>
    <circle cx="27" cy="26" r="5" fill="#f47566"/>
    <circle cx="47" cy="26" r="5" fill="#e9c267"/>
    <circle cx="67" cy="26" r="5" fill="#b9ff66"/>
    <text x="96" y="32" class="mono" font-size="16" fill="#94a59a">benzo@github ~ / profile</text>
    <text x="1236" y="32" text-anchor="end" class="mono" font-size="14" fill="#94a59a">CTRL + CURIOSITY</text>

    <text x="52" y="113" class="mono" font-size="17" letter-spacing="2" fill="#b9ff66">// SECURITY × AI × SYSTEMS</text>
    <text x="46" y="236" class="sans" font-size="112" font-weight="900" letter-spacing="-7" fill="#b9ff66">0xBENZO</text>
    <rect class="cursor" x="603" y="157" width="19" height="84" fill="#b9ff66"/>
    <text x="52" y="287" class="mono" font-size="23" letter-spacing="1" fill="#f0f6ed">TUSHAR SINGH BISHT</text>
    <text x="52" y="326" class="mono" font-size="19" fill="#9baaa0">Engineer. CTF player. Terminal enthusiast.</text>
    <path d="M52 365H89" stroke="#ffb86b" stroke-width="3"/>
    <text x="102" y="371" class="mono" font-size="17" fill="#ffb86b">FOLLOW THE SIGNAL. QUESTION THE SYSTEM.</text>
    <text x="52" y="414" class="mono" font-size="15" fill="#85978b">NEW DELHI, INDIA  /  DELHI TECHNOLOGICAL UNIVERSITY</text>

    <g fill="none" stroke="#314438">
      <circle cx="1000" cy="255" r="146"/>
      <circle cx="1000" cy="255" r="102"/>
      <circle cx="1000" cy="255" r="54"/>
      <path d="M821 255H1179M1000 76V434" stroke-dasharray="3 8"/>
      <path d="M895 153L1105 357M895 357L1105 153" opacity=".55"/>
    </g>
    <g class="orbit" fill="none" stroke="#b9ff66" stroke-width="2">
      <circle cx="1000" cy="255" r="160" stroke-dasharray="110 35 25 120 180 70 10 455" opacity=".75"/>
      <circle cx="1000" cy="95" r="4" fill="#b9ff66" stroke="none" filter="url(#glow)"/>
    </g>
    <path class="packet" d="M893 156L1000 255L1107 352M893 352L1000 255L1107 156" stroke="#b9ff66" stroke-width="2" fill="none"/>
    <circle cx="1000" cy="255" r="32" fill="#16251a" stroke="#b9ff66"/>
    <path d="M984 249L978 255L984 261M1016 249L1022 255L1016 261M1005 242L995 268" stroke="#b9ff66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <g class="mono" font-size="13" text-anchor="middle">
      <rect x="840" y="126" width="111" height="35" rx="4" fill="#111d16" stroke="#47603e"/>
      <text x="895" y="148" fill="#c7e4b4">SECURITY</text>
      <rect x="1069" y="126" width="76" height="35" rx="4" fill="#111d16" stroke="#47603e"/>
      <text x="1107" y="148" fill="#c7e4b4">AI</text>
      <rect x="846" y="349" width="98" height="35" rx="4" fill="#111d16" stroke="#47603e"/>
      <text x="895" y="371" fill="#c7e4b4">SYSTEMS</text>
      <rect x="1058" y="349" width="98" height="35" rx="4" fill="#111d16" stroke="#47603e"/>
      <text x="1107" y="371" fill="#c7e4b4">CLOUD</text>
      <text x="1000" y="426" font-size="12" letter-spacing="3" fill="#85978b">THE SIGNAL LAB</text>
    </g>
    <rect x="672" y="53" width="55" height="398" fill="url(#fade)" transform="translate(1399 0) scale(-1 1)"/>
    <g class="mono" font-size="15">
      <circle class="pulse" cx="57" cy="486" r="4" fill="#b9ff66"/>
      <text x="74" y="491" fill="#c0d0c4">BUILD / BREAK / UNDERSTAND / REPEAT</text>
      <text x="1230" y="491" text-anchor="end" fill="#85978b">0xbenzo.dev ↗</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="519" rx="18" fill="none" stroke="#2b4132"/>
</svg>
