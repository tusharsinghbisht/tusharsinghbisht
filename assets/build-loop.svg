<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="124" viewBox="0 0 1280 124" role="img" aria-labelledby="title desc">
  <title id="title">Build. Break. Understand. Repeat.</title>
  <desc id="desc">Four stages of a loop, connected by a neon signal that moves from curiosity to understanding.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .signal { stroke-dasharray: 34 1210; animation: flow 8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -1244; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
    </style>
    <clipPath id="clip"><rect width="1280" height="124" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="124" fill="#080e0c"/>
    <path d="M40 94H1240" stroke="#2b4132"/>
    <path class="signal" d="M40 94H1240" stroke="#b9ff66" stroke-width="3" fill="none"/>
    <g font-size="12" fill="#819486">
      <text x="49" y="31">01 / CURIOSITY</text>
      <text x="349" y="31">02 / CHAOS</text>
      <text x="649" y="31">03 / CLARITY</text>
      <text x="949" y="31">04 / AGAIN</text>
    </g>
    <g font-size="28" font-weight="700" letter-spacing="1">
      <text x="49" y="68" fill="#b9ff66">BUILD</text>
      <text x="349" y="68" fill="#ffb86b">BREAK</text>
      <text x="649" y="68" fill="#f0f6ed">UNDERSTAND</text>
      <text x="949" y="68" fill="#b9ff66">REPEAT</text>
    </g>
    <g fill="none" stroke="#718778" stroke-width="1.5">
      <path d="M265 56H291L284 49M291 56L284 63"/>
      <path d="M565 56H591L584 49M591 56L584 63"/>
      <path d="M865 56H891L884 49M891 56L884 63"/>
      <path d="M1155 56H1193V32H1175M1181 26L1175 32L1181 38"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="123" rx="12" stroke="#2b4132" fill="none"/>
</svg>
